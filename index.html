<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Report</title>
<style>
:root{--bg:#0d1117;--s1:#161b22;--s2:#1c2128;--bd:#30363d;--tx:#e6edf3;--tm:#7d8590;--gr:#3fb950;--gd:#1a3a21;--rd:#f85149;--rdd:#3d1a1a;--bl:#58a6ff;--yw:#d29922;--ac:#238636}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.6;padding:20px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.hdr h1{font-size:20px;font-weight:700}
.hdr .meta{color:var(--tm);font-size:12px;margin-top:3px}
.btn{background:var(--ac);color:#fff;border:none;padding:7px 13px;border-radius:6px;cursor:pointer;font-size:12px;margin-left:6px}
.btn.sec{background:var(--s2);border:1px solid var(--bd);color:var(--tx)}
.market-tabs{display:flex;gap:8px;margin-bottom:20px}
.mtab{padding:8px 20px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;border:1px solid var(--bd);color:var(--tm);background:var(--s1)}
.mtab.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:13px}
.k .lb{color:var(--tm);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.k .vl{font-size:22px;font-weight:700;margin-top:2px}
.k .sb{color:var(--tm);font-size:11px;margin-top:2px}
.vl.gr{color:var(--gr)}.vl.rd{color:var(--rd)}.vl.bl{color:var(--bl)}.vl.yw{color:var(--yw)}
.sec{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:14px}
.sec h2{font-size:11px;font-weight:600;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:680px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--tm);font-size:11px;text-transform:uppercase;padding:6px 10px;border-bottom:1px solid var(--bd)}
td{padding:8px 10px;border-bottom:1px solid var(--s2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--s2)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:500}
.tag.gr{background:var(--gd);color:var(--gr)}.tag.rd{background:var(--rdd);color:var(--rd)}
.tag.yw{background:#2d2208;color:var(--yw)}.tag.bl{background:#0d2137;color:var(--bl)}
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.bar-lb{width:85px;font-size:11px;color:var(--tm);flex-shrink:0}
.bar-tr{flex:1;background:var(--s2);border-radius:3px;height:6px;overflow:hidden}
.bar-fi{height:100%;border-radius:3px;transition:width .4s}
.bar-fi.gr{background:var(--gr)}.bar-fi.rd{background:var(--rd)}.bar-fi.bl{background:var(--bl)}
.bar-vl{width:100px;text-align:right;font-size:11px;font-weight:600}
.empty{color:var(--tm);text-align:center;padding:24px;font-size:13px}
.note{background:var(--s2);border-left:3px solid var(--yw);padding:7px 10px;border-radius:0 4px 4px 0;font-size:12px;color:var(--tm);margin-top:8px}
.note.gr{border-color:var(--gr)}.note.rd{border-color:var(--rd)}
canvas{width:100%!important}
.page-tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:1px solid var(--bd)}
.ptab{padding:7px 14px;cursor:pointer;font-size:12px;color:var(--tm);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptab.active{color:var(--tx);border-bottom-color:var(--bl)}
.tab-content{display:none}.tab-content.active{display:block}
.pnl-pos{color:var(--gr);font-weight:600}.pnl-neg{color:var(--rd);font-weight:600}
#lock-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
.lock-box{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:32px;width:280px;text-align:center}
.lock-box h2{font-size:16px;margin-bottom:16px}
.lock-box input{width:100%;padding:9px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-size:14px;margin-bottom:10px}
.lock-box .err{color:var(--rd);font-size:12px;min-height:16px;margin-bottom:8px}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <h2>请输入访问口令</h2>
    <input type="password" id="pw-input" placeholder="口令" onkeydown="if(event.key==='Enter')checkPassword()">
    <div class="err" id="pw-err"></div>
    <button class="btn" style="width:100%" onclick="checkPassword()">进入报告</button>
  </div>
</div>

<div id="app" style="display:none">
<div class="hdr">
  <div>
    <h1>量化交易报告（在线版，次日更新）</h1>
    <div class="meta" id="meta">加载中...</div>
  </div>
  <div>
    <button class="btn sec" onclick="location.reload()">刷新页面</button>
  </div>
</div>

<div class="market-tabs">
  <div class="mtab active" onclick="switchMarket('A')">A股市场</div>
  <div class="mtab" onclick="switchMarket('US')">美股市场</div>
  <div class="mtab" onclick="switchMarket('ALL')">全市场汇总</div>
</div>

<div id="market-content"></div>
</div>

function b64ToBytes(b64){
  const bin = atob(b64); const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
async function decryptReport(pw){
  if(!(window.crypto && window.crypto.subtle)) throw new Error('NO_SUBTLE');
  const e = window.__ENC__;
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64ToBytes(e.salt), iterations:e.iter, hash:'SHA-256'},
    keyMat, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBytes(e.iv)}, key, b64ToBytes(e.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}


async function unlockWith(pw, silent){
  const errEl = document.getElementById('pw-err');
  try{
    errEl.textContent = silent ? '' : '解密中，请稍候…';
    const data = await decryptReport(pw);
    window.__REPORT_DATA__ = data;
    try{ sessionStorage.setItem('report_pw', pw); }catch(e){}
    document.getElementById('lock-screen').style.display='none';
    document.getElementById('app').style.display='block';
    loadEmbeddedData();
    return true;
  }catch(e){
    if(e && e.message==='NO_SUBTLE'){
      errEl.textContent='当前浏览器环境不支持解密（需要通过 https 网址或本地文件打开）';
    }else{
      errEl.textContent = silent ? '' : '口令错误，或数据文件已损坏';
      try{ sessionStorage.removeItem('report_pw'); }catch(_){}
    }
    return false;
  }
}
function checkPassword(){ unlockWith(document.getElementById('pw-input').value, false); }


let ALL_TRADES=[], A_ACCOUNT=null, US_ACCOUNT=null;
let currentMarket='A';

function loadEmbeddedData(){
  const d = window.__REPORT_DATA__ || {};
  ALL_TRADES = d.trades || [];
  A_ACCOUNT  = d.account || null;
  US_ACCOUNT = d.us_account || null;
  render();
}

function render(){
  const now=window.__REPORT_DATA__?.generated_at||'';
  const dd=window.__REPORT_DATA__||{};
  const oldest=ALL_TRADES.length?ALL_TRADES[0].time?.slice(0,10):'--';
  const note=dd.cutoff?` | 统计起点 ${dd.cutoff}（此前${dd.excluded||0}条记录属于系统不稳定期，未纳入）`:' | 含全部历史记录';
  document.getElementById('meta').textContent=`${oldest} 至今${note} | 报告生成于 ${now}`;
  renderMarket(currentMarket);
}

function switchMarket(m){
  currentMarket=m;
  document.querySelectorAll('.mtab').forEach((t,i)=>{
    t.classList.toggle('active',['A','US','ALL'][i]===m);
  });
  renderMarket(m);
}

function getTradesByMarket(m){
  if(m==='A') return ALL_TRADES.filter(r=>!(r.market||'').includes('美股')&&(r.market?.includes('A股')||r.market?.includes('本地')||(!r.market&&r.code?.match(/^\d{6}/))));
  if(m==='US') return ALL_TRADES.filter(r=>r.market?.includes('US')||r.market?.includes('美股')||(!r.market&&r.code?.match(/^[A-Z]+$/)));
  return ALL_TRADES;
}

function renderMarket(m){
  const trades=getTradesByMarket(m);
  const sells=trades.filter(r=>r.action==='SELL'&&r.pnl_pct!=null);
  const buys=trades.filter(r=>r.action==='BUY');
  const wins=sells.filter(r=>r.pnl_pct>0);
  const losses=sells.filter(r=>r.pnl_pct<=0);
  const wr=sells.length?wins.length/sells.length*100:0;
  const aw=wins.length?wins.reduce((s,r)=>s+r.pnl_pct,0)/wins.length:0;
  const al=losses.length?losses.reduce((s,r)=>s+r.pnl_pct,0)/losses.length:0;
  const pf=al?aw/Math.abs(al):0;
  const ev=wr/100*aw+(1-wr/100)*al;
  const totalPnlAmt=sells.reduce((s,r)=>s+(r.pnl_amount||0),0);
  const cur=m==='US'?'$':'¥';

  let acct=null;
  if(m==='A') acct=A_ACCOUNT;
  else if(m==='US') acct=US_ACCOUNT;
  const cap=acct?.capital||0, ini=acct?.initial||(m==='A'?500000:1000000);
  const ret=ini?(cap-ini)/ini*100:0;
  const posCount=acct?.positions?Object.keys(acct.positions).length:0;

  const html=`
  <div class="kpi">
    <div class="k"><div class="lb">已实现盈亏金额</div>
      <div class="vl ${totalPnlAmt>=0?'gr':'rd'}">${totalPnlAmt>=0?'+':'-'}${cur}${Math.abs(totalPnlAmt).toLocaleString('zh-CN',{maximumFractionDigits:0})}</div>
      <div class="sb">${sells.length}笔已平仓</div></div>
    ${acct?`<div class="k"><div class="lb">账户余额</div>
      <div class="vl ${cap>=ini?'gr':'rd'}">${cur}${cap.toLocaleString('zh-CN',{maximumFractionDigits:0})}</div>
      <div class="sb">初始${cur}${(ini/10000).toFixed(0)}万 ${ret>=0?'+':''}${ret.toFixed(2)}%</div></div>`:''}
    <div class="k"><div class="lb">胜率</div>
      <div class="vl ${wr>=50?'gr':'rd'}">${wr.toFixed(1)}%</div>
      <div class="sb">${wins.length}胜 / ${sells.length}笔</div></div>
    <div class="k"><div class="lb">盈亏比</div>
      <div class="vl ${pf>=1.5?'gr':pf>=1?'yw':'rd'}">${pf.toFixed(2)}</div>
      <div class="sb">均赚${aw.toFixed(1)}% / 均亏${al.toFixed(1)}%</div></div>
    <div class="k"><div class="lb">期望值</div>
      <div class="vl ${ev>=0?'gr':'rd'}">${ev>=0?'+':''}${ev.toFixed(2)}%<span style="font-size:12px">/笔</span></div>
      <div class="sb">${ev>=0?'✅正期望':'⚠️负期望'}</div></div>
    <div class="k"><div class="lb">交易笔数</div>
      <div class="vl bl">${trades.length}</div>
      <div class="sb">买${buys.length} / 卖${sells.length}</div></div>
    ${acct?`<div class="k"><div class="lb">当前持仓</div>
      <div class="vl bl">${posCount}</div>
      <div class="sb">最多6只</div></div>`:''}
    <div class="k"><div class="lb">最大单笔盈利</div>
      <div class="vl gr">+${sells.length?Math.max(...sells.map(r=>r.pnl_pct)).toFixed(2):0}%</div>
      <div class="sb">最大亏损：${sells.length?Math.min(...sells.map(r=>r.pnl_pct)).toFixed(2):0}%</div></div>
  </div>

  <div class="page-tabs">
    <div class="ptab active" onclick="switchTab(this,'t-chart-${m}')">📈 盈亏曲线</div>
    <div class="ptab" onclick="switchTab(this,'t-dist-${m}')">📊 分布分析</div>
    <div class="ptab" onclick="switchTab(this,'t-pos-${m}')">💼 持仓明细</div>
    <div class="ptab" onclick="switchTab(this,'t-trades-${m}')">📋 交易记录</div>
  </div>

  <div id="t-chart-${m}" class="tab-content active">
    <div class="sec"><h2>累计已实现盈亏曲线（%）</h2><canvas id="chart-${m}" height="130"></canvas></div>
  </div>

  <div id="t-dist-${m}" class="tab-content">
    <div class="two">
      <div class="sec"><h2>平仓方式分布</h2><div id="exit-${m}"></div></div>
      <div class="sec"><h2>评分区间胜率</h2><div id="score-${m}"></div></div>
    </div>
    <div class="sec"><h2>市场环境表现</h2><div id="env-${m}"></div></div>
    <div class="sec"><h2>策略信号成因</h2><div id="reason-${m}"></div></div>
  </div>

  <div id="t-pos-${m}" class="tab-content">
    <div class="sec"><h2>当前持仓明细</h2><div id="pos-${m}"></div></div>
  </div>

  <div id="t-trades-${m}" class="tab-content">
    <div class="sec"><h2>历史交易记录（最近100笔）</h2><div id="trades-${m}"></div></div>
  </div>`;

  document.getElementById('market-content').innerHTML=html;

  setTimeout(()=>{
    renderChart(`chart-${m}`, sells);
    renderExitDist(`exit-${m}`, sells);
    renderScoreDist(`score-${m}`, sells);
    renderEnvDist(`env-${m}`, sells);
    renderReasonDist(`reason-${m}`, sells);
    renderPositions(`pos-${m}`, acct, cur, m);
    renderTrades(`trades-${m}`, trades, cur);
  }, 50);
}

function switchTab(el, id){
  const parent=el.parentElement;
  parent.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  let sib=parent.nextElementSibling;
  while(sib&&sib.classList.contains('tab-content')){
    sib.classList.remove('active');sib=sib.nextElementSibling;
  }
  document.getElementById(id)?.classList.add('active');
}

function bar(lb,v,n,cls,valStr){
  return `<div class="bar-row"><div class="bar-lb">${lb}</div>
    <div class="bar-tr"><div class="bar-fi ${cls}" style="width:${n?v/n*100:0}%"></div></div>
    <div class="bar-vl ${cls}">${valStr}</div></div>`;
}

function renderChart(id, sells){
  const c=document.getElementById(id);if(!c)return;
  const ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr;c.height=130*dpr;ctx.scale(dpr,dpr);
  const W=c.offsetWidth,H=130;
  if(!sells.length){ctx.fillStyle='#7d8590';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('暂无平仓数据',W/2,H/2);return;}
  let cum=[0];sells.forEach(r=>cum.push(cum[cum.length-1]+(r.pnl_pct||0)));
  const mn=Math.min(...cum),mx=Math.max(...cum),rng=mx-mn||1;
  const p={l:42,r:20,t:8,b:26};
  const cW=W-p.l-p.r,cH=H-p.t-p.b;
  const xS=cW/(cum.length-1);
  const yS=v=>p.t+cH-((v-mn)/rng*cH);
  ctx.strokeStyle='#30363d';ctx.lineWidth=1;ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(p.l,yS(0));ctx.lineTo(W-p.r,yS(0));ctx.stroke();ctx.setLineDash([]);
  const fin=cum[cum.length-1];
  const g=ctx.createLinearGradient(0,p.t,0,H-p.b);
  if(fin>=0){g.addColorStop(0,'rgba(63,185,80,.2)');g.addColorStop(1,'rgba(63,185,80,.01)');}
  else{g.addColorStop(0,'rgba(248,81,73,.01)');g.addColorStop(1,'rgba(248,81,73,.2)');}
  ctx.beginPath();cum.forEach((v,i)=>{const x=p.l+i*xS,y=yS(v);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.lineTo(p.l+(cum.length-1)*xS,H-p.b);ctx.lineTo(p.l,H-p.b);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle=fin>=0?'#3fb950':'#f85149';ctx.lineWidth=2;ctx.beginPath();
  cum.forEach((v,i)=>{const x=p.l+i*xS,y=yS(v);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  const lx=p.l+(cum.length-1)*xS,ly=yS(fin);
  ctx.fillStyle=fin>=0?'#3fb950':'#f85149';ctx.beginPath();ctx.arc(lx,ly,3,0,Math.PI*2);ctx.fill();
  ctx.font='bold 11px sans-serif';ctx.textAlign='left';
  ctx.fillText((fin>=0?'+':'')+fin.toFixed(1)+'%',lx+5,ly+4);
  ctx.fillStyle='#7d8590';ctx.font='10px sans-serif';ctx.textAlign='right';
  [mn,(mn+mx)/2,mx].forEach(v=>{ctx.fillText((v>=0?'+':'')+v.toFixed(1)+'%',p.l-3,yS(v)+4);});
}

function renderExitDist(id, sells){
  const el=document.getElementById(id);if(!el)return;
  const sl=sells.filter(r=>r.reason?.includes('止损'));
  const tp=sells.filter(r=>r.reason?.includes('目标')||r.reason?.includes('止盈'));
  const ot=sells.filter(r=>!sl.includes(r)&&!tp.includes(r));
  const n=sells.length||1;
  const asl=sl.length?sl.reduce((s,r)=>s+r.pnl_pct,0)/sl.length:0;
  const atp=tp.length?tp.reduce((s,r)=>s+r.pnl_pct,0)/tp.length:0;
  const slAmt=sl.reduce((s,r)=>s+(r.pnl_amount||0),0);
  const tpAmt=tp.reduce((s,r)=>s+(r.pnl_amount||0),0);
  const slPct=sl.length/n*100;
  el.innerHTML=
    bar('止损平仓',sl.length,n,'rd',`${sl.length}笔(${slPct.toFixed(0)}%) 均${asl.toFixed(1)}%`)+
    bar('止盈平仓',tp.length,n,'gr',`${tp.length}笔(${(tp.length/n*100).toFixed(0)}%) 均+${atp.toFixed(1)}%`)+
    bar('其他平仓',ot.length,n,'bl',`${ot.length}笔`)+
    `<div style="margin-top:8px;font-size:11px;color:var(--tm)">止损损失：<span class="pnl-neg">${slAmt.toFixed(0)}</span>元 | 止盈收益：<span class="pnl-pos">+${tpAmt.toFixed(0)}</span>元</div>`+
    `<div class="note ${slPct>60?'rd':'gr'}">${slPct>60?'⚠️止损占比'+slPct.toFixed(0)+'%偏高，建议检查入场点位或放宽止损线':'✅止损占比合理'}</div>`;
}

function renderScoreDist(id, sells){
  const el=document.getElementById(id);if(!el)return;
  const bkts=[{lb:'50-59分',lo:50,hi:60},{lb:'60-69分',lo:60,hi:70},{lb:'70-79分',lo:70,hi:80},{lb:'80+分',lo:80,hi:999}];
  let html='';
  bkts.forEach(b=>{
    const g=sells.filter(r=>r.score>=b.lo&&r.score<b.hi);if(!g.length)return;
    const wr=g.filter(r=>r.pnl_pct>0).length/g.length*100;
    const ev=g.reduce((s,r)=>s+r.pnl_pct,0)/g.length;
    html+=bar(b.lb,wr,100,wr>=50?'gr':'rd',`胜率${wr.toFixed(0)}%(${g.length}笔) 期望${ev>=0?'+':''}${ev.toFixed(1)}%`);
  });
  el.innerHTML=html||'<div class="empty">样本不足</div>';
}

function renderEnvDist(id, sells){
  const el=document.getElementById(id);if(!el)return;
  let html='';
  ['牛市🐂','震荡🦀','熊市🐻'].forEach(env=>{
    const g=sells.filter(r=>r.market_env===env);if(!g.length)return;
    const wr=g.filter(r=>r.pnl_pct>0).length/g.length*100;
    const ev=g.reduce((s,r)=>s+r.pnl_pct,0)/g.length;
    html+=bar(env,g.length,sells.length||1,wr>=50?'gr':'rd',`${g.length}笔 胜率${wr.toFixed(0)}% 期望${ev>=0?'+':''}${ev.toFixed(1)}%`);
  });
  el.innerHTML=html||'<div class="empty">暂无市场环境数据</div>';
}

function renderReasonDist(id, sells){
  const el=document.getElementById(id);if(!el)return;
  const kws={};
  sells.forEach(r=>{
    ['突破','回踩','缩量','放量','涨停','多头','趋势','共振','冲浪','乘风','探索','海龟'].forEach(kw=>{
      if((r.buy_reason||r.reason||'').includes(kw)){
        if(!kws[kw]) kws[kw]={n:0,w:0,pnl:0};
        kws[kw].n++;if(r.pnl_pct>0)kws[kw].w++;kws[kw].pnl+=r.pnl_pct;
      }
    });
  });
  const sorted=Object.entries(kws).filter(([,v])=>v.n>=2).sort((a,b)=>b[1].pnl/b[1].n-a[1].pnl/a[1].n);
  if(!sorted.length){el.innerHTML='<div class="empty">样本不足</div>';return;}
  const maxN=Math.max(...sorted.map(([,v])=>v.n));
  el.innerHTML=sorted.map(([kw,v])=>{
    const wr=v.w/v.n*100,ev=v.pnl/v.n;
    return bar(`「${kw}」`,v.n,maxN,ev>=0?'gr':'rd',`${v.n}笔 胜率${wr.toFixed(0)}% 期望${ev>=0?'+':''}${ev.toFixed(1)}%`);
  }).join('');
}

function renderPositions(id, acct, cur, market){
  const el=document.getElementById(id);if(!el)return;
  if(!acct?.positions||!Object.keys(acct.positions).length){
    el.innerHTML='<div class="empty">当前无持仓</div>';return;
  }
  const rows=Object.entries(acct.positions).map(([code,p])=>{
    const bp=parseFloat(p.buy_price||0);
    const sl=parseFloat(p.stop_loss||0);
    const tg=parseFloat(p.target||0);
    const cost=parseFloat(p.cost||bp*(p.shares||0));
    const shares=parseInt(p.shares||0);
    const rr=(sl&&tg&&bp)?((tg-bp)/(bp-sl)).toFixed(1):'--';
    return `<tr>
      <td><strong>${code}</strong></td>
      <td>${cur}${bp?.toFixed(2)||'--'}</td>
      <td>${shares?.toLocaleString()||'--'}</td>
      <td>${cur}${cost?.toFixed(0)||'--'}</td>
      <td>${cur}${sl?.toFixed(2)||'--'}</td>
      <td>${cur}${tg?.toFixed(2)||'--'}</td>
      <td>${rr}:1</td>
      <td>${p.score||'--'}分</td>
      <td style="color:var(--tm);font-size:11px">${p.buy_date?.slice(0,10)||'--'}</td>
      <td><span class="tag ${p.market_env?.includes('牛')?'gr':p.market_env?.includes('熊')?'rd':'yw'}">${p.market_env||'--'}</span></td>
    </tr>`;
  }).join('');
  el.innerHTML=`<table><thead><tr>
    <th>代码</th><th>买入价</th><th>股数</th><th>成本</th><th>止损价</th><th>目标价</th><th>盈亏比</th><th>评分</th><th>买入日</th><th>市场环境</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function renderTrades(id, trades, cur){
  const el=document.getElementById(id);if(!el)return;
  if(!trades.length){el.innerHTML='<div class="empty">暂无交易记录</div>';return;}
  const rows=[...trades].reverse().slice(0,100).map(r=>{
    const isBuy=r.action==='BUY';
    const pnlPct=!isBuy&&r.pnl_pct!=null?`<span class="${r.pnl_pct>=0?'pnl-pos':'pnl-neg'}">${r.pnl_pct>=0?'+':''}${r.pnl_pct.toFixed(2)}%</span>`:'--';
    const pnlAmt=!isBuy&&r.pnl_amount!=null?`<span class="${r.pnl_amount>=0?'pnl-pos':'pnl-neg'}">${r.pnl_amount>=0?'+':''}${cur}${Math.abs(r.pnl_amount).toFixed(0)}</span>`:'--';
    const noteAttr=r.position_note?` title="${r.position_note.replace(/"/g,'&quot;')}"`:'';
    return `<tr${noteAttr}>
      <td style="color:var(--tm);font-size:11px">${r.time?.slice(0,16)||'--'}</td>
      <td><strong>${r.code||'--'}</strong></td>
      <td><span class="tag ${isBuy?'gr':'rd'}">${isBuy?'买入':'卖出'}</span></td>
      <td>${cur}${r.price?.toFixed(2)||'--'}</td>
      <td>${r.shares?.toLocaleString()||'--'}</td>
      <td>${r.score||'--'}分</td>
      <td>${pnlPct}</td>
      <td>${pnlAmt}</td>
      <td style="color:var(--tm);font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.reason?.slice(0,30)||'--'}${r.reason?.length>30?'…':''}</td>
      <td><span class="tag ${r.market_env?.includes('牛')?'gr':r.market_env?.includes('熊')?'rd':'yw'}">${r.market_env||'--'}</span></td>
    </tr>`;
  }).join('');
  el.innerHTML=`<table><thead><tr>
    <th>时间</th><th>代码</th><th>方向</th><th>价格</th><th>股数</th><th>评分</th><th>盈亏%</th><th>盈亏金额</th><th>原因(悬停看仓位依据)</th><th>市场环境</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}
